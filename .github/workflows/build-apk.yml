name: Build 4-Layer Secure Signed Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Layer 1 - Hard Obfuscate JavaScript & Minify HTML
        run: |
          mkdir -p www assets
          npm install javascript-obfuscator
          npm install -g html-minifier-terser
          node -e '
            const fs = require("fs");
            const JavaScriptObfuscator = require("javascript-obfuscator");
            let html = fs.readFileSync("index.html", "utf8");
            html = html.replace(/<script([^>]*)>([\s\S]*?)<\/script>/gi, (match, attrs, code) => {
              if (attrs.includes("src=") || !code.trim()) return match;
              const obf = JavaScriptObfuscator.obfuscate(code, {
                compact: true,
                controlFlowFlattening: true,
                stringArray: true,
                stringArrayEncoding: ["base64"],
                disableConsoleOutput: true
              }).getObfuscatedCode();
              return `<script${attrs}>${obf}</script>`;
            });
            fs.writeFileSync("www/temp.html", html);
          '
          html-minifier-terser --collapse-whitespace --remove-comments --minify-css true www/temp.html -o www/index.html
          rm www/temp.html

      - name: Layer 2 & 3 - Build Capacitor Android Project
        run: |
          cp *.png assets/icon-only.png
          cp *.png assets/icon-foreground.png
          cp *.png assets/icon-background.png
          npm install
          npm install -D @capacitor/assets
          npx cap init "Neon Rush Car Dodge" "com.madxharsh.neonrushcardodge" --web-dir www
          npx cap add android
          npx capacitor-assets generate --android

      - name: Layer 4 - Generate Keystore & Build Signed Release APK
        run: |
          cd android/app
          keytool -genkey -v -keystore release-key.keystore -alias neonrush -keyalg RSA -keysize 2048 -validity 10000 -storepass Harsh@2026Secure -keypass Harsh@2026Secure -dname "CN=MadxHarsh, OU=Gaming, O=MadxHarshStudios, L=Ladwa, S=Haryana, C=IN"
          cd ..
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release-key.keystore \
            -Pandroid.injected.signing.store.password=Harsh@2026Secure \
            -Pandroid.injected.signing.key.alias=neonrush \
            -Pandroid.injected.signing.key.password=Harsh@2026Secure

      - name: Upload 4-Layer Secure Signed APK & Keystore
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Rush-Secure-Signed-Release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/release-key.keystore
          
