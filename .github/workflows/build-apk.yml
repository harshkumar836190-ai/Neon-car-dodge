name: Build Clean Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor & Build Android Project
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          cp *.png assets/icon-only.png
          cp *.png assets/icon-foreground.png
          cp *.png assets/icon-background.png
          npm install
          npm install -D @capacitor/assets
          npx cap init "Neon Rush Car Dodge" "com.madxharsh.neonrushcardodge" --web-dir www
          npx cap add android
          npx capacitor-assets generate --android
          sed -i 's/android:usesCleartextTraffic="true"/android:usesCleartextTraffic="true" android:hardwareAccelerated="true"/g' android/app/src/main/AndroidManifest.xml || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Clean APK
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Rush-Car-Dodge-Clean-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
