name: Build 4-Layer Secure Signed Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Layer 1 - Code Obfuscation & Minification
        run: |
          mkdir -p www assets
          npm install -g html-minifier-terser
          html-minifier-terser --collapse-whitespace --remove-comments --minify-js true --minify-css true index.html -o www/index.html

      - name: Layer 2 & 3 - Build Capacitor Android with R8 Hardening
        run: |
          cp *.png assets/icon-only.png
          cp *.png assets/icon-foreground.png
          cp *.png assets/icon-background.png
          npm install
          npm install -D @capacitor/assets
          npx cap init "Neon Rush Car Dodge" "com.madxharsh.neonrushcardodge" --web-dir www
          npx cap add android
          npx capacitor-assets generate --android
          sed -i 's/minifyEnabled false/minifyEnabled true/g' android/app/build.gradle
          sed -i 's/<application/<application android:allowBackup="false" android:debuggable="false"/g' android/app/src/main/AndroidManifest.xml

      - name: Layer 4 - Generate Keystore & Build Signed Release APK
        run: |
          cd android/app
          keytool -genkey -v -keystore release-key.keystore -alias neonrush -keyalg RSA -keysize 2048 -validity 10000 -storepass Harsh@2026Secure -keypass Harsh@2026Secure -dname "CN=MadxHarsh, OU=Gaming, O=MadxHarshStudios, L=Ladwa, S=Haryana, C=IN"
          cd ..
          chmod +x gradlew
          ./gradlew assembleRelease
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 | sort -V | tail -n 1)
          $BUILD_TOOLS/zipalign -v -p 4 "$UNSIGNED_APK" app/build/outputs/apk/release/aligned.apk
          $BUILD_TOOLS/apksigner sign --ks app/release-key.keystore --ks-pass pass:Harsh@2026Secure --key-pass pass:Harsh@2026Secure --out app/build/outputs/apk/release/Neon-Rush-Car-Dodge-Signed-Release.apk app/build/outputs/apk/release/aligned.apk

      - name: Upload 4-Layer Secure Signed APK & Keystore
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Rush-Secure-Signed-Release
          path: |
            android/app/build/outputs/apk/release/Neon-Rush-Car-Dodge-Signed-Release.apk
            android/app/release-key.keystore
